name: quotation_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2

  # PDF & Sharing
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.2
  share_plus: ^7.2.1

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  country_picker: ^2.0.25

  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Noto_Sans/static/